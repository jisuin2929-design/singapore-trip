<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>싱가포르 가족여행 동선지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: map-first split view. Map (left/top) + day itinerary rail (right/below). Day tabs on top. */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --fg:#1d2422; --muted:#5f6b67; --line:#dde2df;
  --sea:#cfe2e8; --land:#eef1ea; --land-edge:#c3cdc4; --label:#7c8a84;
  --taxi:#1f6feb; --walk:#0e8a5f; --rail:#b5530f; --hotel:#8a3ffc;
  --chip:#eef2f0; --focus:#1f6feb;
  --sans:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121615; --panel:#1a201e; --fg:#e7ecea; --muted:#9aa7a2; --line:#2c3532;
  --sea:#13232b; --land:#232a27; --land-edge:#3a4541; --label:#82918b;
  --taxi:#6ea8ff; --walk:#3fcf98; --rail:#f0914d; --hotel:#b68cff;
  --chip:#242c29; --focus:#6ea8ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --panel:#1a201e; --fg:#e7ecea; --muted:#9aa7a2; --line:#2c3532;
  --sea:#13232b; --land:#232a27; --land-edge:#3a4541; --label:#82918b;
  --taxi:#6ea8ff; --walk:#3fcf98; --rail:#f0914d; --hotel:#b68cff;
  --chip:#242c29; --focus:#6ea8ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:16px}
header{display:grid;gap:4px}
h1{font-size:1.5rem;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:.92rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.tab small{color:var(--muted);font-size:.8rem}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.75}
.tab:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--sea);height:min(72vh,640px);min-height:380px;touch-action:none}
@media (max-width:860px){.mapbox{height:58vh;min-height:360px}}
.mapbox svg{display:block;width:100%;height:100%;cursor:grab;user-select:none}
.mapbox svg.drag{cursor:grabbing}
.ctrl{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.ctrl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 18px var(--sans);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ctrl button.fit{font-size:11px}
.legend{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.78rem;display:flex;gap:12px;flex-wrap:wrap;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.dayhead h2{margin:0;font-size:1.15rem;text-wrap:balance}
.dayhead p{margin:2px 0 8px;color:var(--muted);font-size:.88rem}
.allroute{display:inline-block;font-size:.85rem;font-weight:600;color:var(--taxi);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.allroute:hover{background:var(--chip)}
ol.steps{list-style:none;margin:0;padding:0;display:grid}
.stop{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;padding:8px 6px;border-radius:10px;cursor:pointer}
.stop:hover{background:var(--chip)}
.stop.sel{background:var(--chip)}
.badge{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.85rem;background:var(--fg)}
.badge.h{background:var(--hotel)}
.stop .t{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.stop .n{font-weight:600}
.stop .d{font-size:.86rem;color:var(--muted)}
.stop a{font-size:.8rem;color:var(--taxi);text-decoration:none}
.stop a:hover{text-decoration:underline}
.leg{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:0 6px;cursor:pointer}
.leg .bar{justify-self:center;width:0;border-left:3px solid var(--taxi);min-height:34px}
.leg.walk .bar{border-left-style:dotted;border-color:var(--walk)}
.leg.shuttle .bar,.leg.rail .bar{border-left-style:dashed;border-color:var(--rail)}
.leg.zip .bar,.leg.cable .bar{border-left-style:dashed;border-color:var(--hotel)}
.leg .info{font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding-block:6px}
.mode{font-weight:600;color:var(--taxi)}
.leg.walk .mode{color:var(--walk)} .leg.rail .mode{color:var(--rail)} .leg.cable .mode,.leg.zip .mode{color:var(--hotel)} .leg.shuttle .mode{color:var(--rail)}
.leg a{color:var(--muted);font-size:.8rem}
.leg.sel .info{color:var(--fg)}
.notes{border-top:1px solid var(--line);padding-top:10px;font-size:.84rem;color:var(--muted);display:grid;gap:4px}
.notes b{color:var(--fg);font-weight:600}
footer{color:var(--muted);font-size:.82rem;max-width:72ch}
/* map svg */
.coast{fill:var(--land);stroke:var(--land-edge);stroke-width:1;vector-effect:non-scaling-stroke}
.tiles .area{display:none}
#map.tiles + .mapattr{display:block}
.mapattr{display:none;position:absolute;left:0;bottom:0;background:rgba(255,255,255,.8);font:11px var(--sans);color:#333;padding:1px 6px;border-top-right-radius:6px;pointer-events:auto}
.mapattr a{color:#245fc7}
.area{fill:var(--label);font:500 12px var(--sans);letter-spacing:.06em;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--land);stroke-width:3px}
.route{fill:none;stroke-width:4;stroke-linecap:round}
.route.taxi{stroke:var(--taxi)}
.route.walk{stroke:var(--walk);stroke-dasharray:1 8;stroke-width:5}
.route.shuttle,.route.rail{stroke:var(--rail);stroke-dasharray:10 6}
.route.zip,.route.cable{stroke:var(--hotel);stroke-dasharray:3 5;stroke-width:4}
.route.dim{opacity:.28}
.route-halo{fill:none;stroke:var(--panel);stroke-width:8;stroke-linecap:round;opacity:.9}
.arrow.taxi{fill:var(--taxi)} .arrow.walk{fill:var(--walk)} .arrow.rail{fill:var(--rail)} .arrow.cable,.arrow.zip{fill:var(--hotel)} .arrow.shuttle{fill:var(--rail)}
.pin circle{stroke:var(--panel);stroke-width:2.5}
.pin:focus-visible{outline:none}.pin:focus-visible circle,.pin:focus-visible rect{stroke:var(--focus)}
.pin text{fill:#fff;font:700 12px var(--sans);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin .lbl{fill:var(--fg);font:600 12px var(--sans);text-anchor:start;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.pin{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
 
.mapcard{min-width:0;border:1px solid var(--line);background:white;border-radius:16px;overflow:hidden}
.mapbox{border:0;border-radius:0;height:min(67vh,620px)}
#scopes{display:flex;gap:4px;padding:8px;overflow:auto}
#scopes button{font:600 14px var(--sans);white-space:nowrap;border:0;border-radius:8px;padding:8px 10px;background:transparent;color:#53625e;cursor:pointer}
#scopes button[aria-pressed=true]{background:#dcefe9;color:#125845}
.legend{position:static;border:0;gap:6px 16px;padding:9px 12px}
.pin .lbl{font-size:13px;stroke-width:4px}
.tab{border-radius:9px}.tab[aria-selected=true]{background:#184c40;border-color:#184c40}
:root{--fg:#213b34;--hotel:#764598;--walk:#007d5d;--taxi:#245fc7}
@media(max-width:860px){body{padding:14px 10px 32px}.wrap{gap:10px}.mapbox{height:54svh;min-height:340px}.tabs{flex-wrap:nowrap;overflow:auto;gap:5px}.tab{flex:1;justify-content:center;padding:8px 5px;white-space:nowrap}.tab small{display:none}.main{gap:10px}}
#summary{padding:0 12px 8px;color:#405650;font-size:14px}
@media(max-width:540px){.tab{min-height:44px;flex-direction:column;align-items:center;gap:0}.tab small{display:block;font-size:11px}.mapbox{height:48svh;min-height:290px;max-height:480px}#scopes{gap:0;padding:6px 3px;flex-wrap:wrap}#scopes button{font-size:13px;min-height:40px}.ctrl button{width:40px;height:40px}}
</style>

<div class="wrap">
  <header>
    <h1>싱가포르 여행지도</h1>
    <p class="sub">12월 2일–5일 · 가족 여행</p>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="main">
    <section class="mapcard"><div id="scopes" aria-label="표시할 일정"></div><div id="summary" aria-live="polite"></div><div class="mapbox" id="mapbox">
      <svg id="map" aria-label="이동경로 지도" role="img"></svg>
      <div class="mapattr"><a href="https://www.onemap.gov.sg/" target="_blank" rel="noopener">OneMap</a> © contributors | Singapore Land Authority</div>
      <div class="ctrl">
        <button id="zin" aria-label="확대">+</button>
        <button id="zout" aria-label="축소">−</button>
        <button id="zfit" class="fit" aria-label="하루 전체 보기">전체</button>
      </div>
    </div><div class="legend">
        <span><i style="border-color:var(--taxi)"></i>택시·Grab</span>
        <span><i style="border-color:var(--walk);border-top-style:dotted"></i>도보</span>
        <span><i style="border-color:var(--rail);border-top-style:dashed"></i>모노레일·셔틀</span>
        <span><i style="border-color:var(--hotel);border-top-style:dashed"></i>케이블카·짚라인</span>
      </div>
    </section>
    <aside class="side" id="rail"></aside>
  </div>
  <footer> 선은 실제 도로가 아니라 이동 순서를 보여주는 곡선이에요. 시간과 요금은 평소 교통 기준 추정치라 실제와 다를 수 있어요. 일정은 11월 19일 최종 확정안 기준이에요.</footer>
</div>

const K = 1000, CL = Math.cos(1.3*Math.PI/180);

let coastD = "";
const chaikin = r => { let p=r; for(let k=0;k<2;k++){ const q=[]; for(let i=0;i<p.length;i++){ const a=p[i], b=p[(i+1)%p.length]; q.push([.75*a[0]+.25*b[0],.75*a[1]+.25*b[1]],[.25*a[0]+.75*b[0],.25*a[1]+.75*b[1]]); } p=q; } return p; };
for (const r of COAST){ coastD += "M"+chaikin(r.map(([x,y])=>[wx(x),wy(y)])).map(([x,y])=>x.toFixed(2)+","+y.toFixed(2)).join("L")+"Z"; }

const gTiles = el('g',{},gWorld), tileZ = {}, tileImg = {};
let tilesOK = false;
const TURL = (z,x,y)=>`https://www.onemap.gov.sg/maps/tiles/Default/${z}/${x}/${y}.png`;
const lon2t=(lon,z)=>(lon+180)/360*2**z, lat2t=(lat,z)=>(1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*2**z;
const t2lon=(x,z)=>x/2**z*360-180, t2lat=(y,z)=>Math.atan(Math.sinh(Math.PI*(1-2*y/2**z)))*180/Math.PI;
function drawTiles(){
  const [w,h]=size(), s=view.s, dpr=Math.min(window.devicePixelRatio||1,2);
  const pxPerDeg=1000*CL*s;
  let z=Math.round(Math.log2(pxPerDeg*dpr*360/256)); z=Math.max(11,Math.min(19,z));
  const lon0=103.55+(-view.tx/s)/(1000*CL), lon1=103.55+((w-view.tx)/s)/(1000*CL);
  const lat0=1.5-(-view.ty/s)/1000, lat1=1.5-((h-view.ty)/s)/1000;
  const want=new Set();
  [z-1,z].forEach(zz=>{ if(zz<11) return;
    if(!tileZ[zz]){ tileZ[zz]=el('g',{},gTiles); Object.keys(tileZ).map(Number).sort((a,b)=>a-b).forEach(k=>gTiles.appendChild(tileZ[k])); }
    const x0=Math.floor(lon2t(lon0,zz)), x1=Math.floor(lon2t(lon1,zz)), y0=Math.floor(lat2t(lat0,zz)), y1=Math.floor(lat2t(lat1,zz));
    if((x1-x0+1)*(y1-y0+1)>80) return;
    for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++){ const k=zz+'/'+x+'/'+y; want.add(k);
      if(!tileImg[k]){ const L0=t2lon(x,zz), L1=t2lon(x+1,zz), A0=t2lat(y,zz), A1=t2lat(y+1,zz);
        const X=wx(L0), Y=wy(A0), im=el('image',{x:X,y:Y,width:(wx(L1)-X)*1.004,height:(wy(A1)-Y)*1.004,preserveAspectRatio:'none'},tileZ[zz]);
        im.addEventListener('load',()=>{ if(!tilesOK){ tilesOK=true; svg.classList.add('tiles'); } });
        im.setAttribute('href',TURL(zz,x,y)); tileImg[k]=im; } }
  });
  for(const k in tileImg) tileImg[k].style.display=want.has(k)?'':'none';
}

function size(){ const r=svg.getBoundingClientRect(); return [r.width||600, r.height||400]; }
function fit(pts, maxS){
  const [w,h]=size();
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  pts.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);});
  const pl=Math.min(70,w*.12), pr=Math.min(65,w*.13), pt=50, pb=42, bw=Math.max(x1-x0,4), bh=Math.max(y1-y0,4);
  let s=Math.min((w-pl-pr)/bw,(h-pt-pb)/bh); s=Math.min(s,maxS||400); s=Math.max(s,.4);
  view={s, tx:pl+(w-pl-pr)/2-(x0+x1)/2*s, ty:pt+(h-pt-pb)/2-(y0+y1)/2*s};
  render();
}

function curve(a,b,i){
  const [x0,y0]=a,[x1,y1]=b, dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy)||1;
  const k=(i%2?1:-1)*Math.min(.22, 40/L+.1);
  const cx=(x0+x1)/2-dy*k, cy=(y0+y1)/2+dx*k;
  return {d:`M${x0},${y0}Q${cx},${cy} ${x1},${y1}`, pt:t=>[(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*x1,(1-t)*(1-t)*y0+2*(1-t)*t*cy+t*t*y1], L};
}

function render(){
  gWorld.setAttribute('transform',`translate(${view.tx},${view.ty}) scale(${view.s})`);
  drawTiles();
  gOver.textContent='';
  const S=([x,y])=>[x*view.s+view.tx, y*view.s+view.ty];
  // area labels
  AREAS.forEach(([n,la,lo])=>{ const [x,y]=S([wx(lo),wy(la)]); el('text',{x,y,class:'area'},gOver).textContent=n; });
  // legs
  const legs=[]; day.stops.forEach((s,i)=>{ if(i>0) legs.push({a:day.stops[i-1].p,b:s.p,m:s.leg.m,i}); });
  const [,start,end]=ranges()[scope];
  legs.filter(l=>l.i>start && l.i<=end).forEach(l=>{
    const a=S(W(l.a)), b=S(W(l.b)); if(Math.hypot(b[0]-a[0],b[1]-a[1])<3) return;
    const c=curve(a,b,l.i), dim = sel && sel.type==='leg' && sel.i!==l.i;
    el('path',{d:c.d,class:'route-halo'+(dim?' dim':'')},gOver);
    const r=el('path',{d:c.d,class:`route ${l.m}${dim?' dim':''}`},gOver);
    r.style.cursor='pointer'; r.addEventListener('click',()=>pickLeg(l.i));
    if(c.L>60){ const p=c.pt(.55), q=c.pt(.58), ang=Math.atan2(q[1]-p[1],q[0]-p[0])*180/Math.PI;
      const ar=el('path',{d:'M-6,-5L6,0L-6,5Z',class:`arrow ${l.m}`,transform:`translate(${p[0]},${p[1]}) rotate(${ang})`},gOver); if(dim) ar.setAttribute('opacity',.3); }
  });
  // pins grouped by place, then clustered when they overlap on screen
  const groups={}; day.stops.forEach((s,i)=>{ if(i>=start && i<=end) (groups[s.p]=groups[s.p]||[]).push(i); });
  const cl=[];
  Object.entries(groups).forEach(([p,idx])=>{ const xy=S(W(p));
    const c=cl.find(c=>Math.hypot(c.x-xy[0],c.y-xy[1])<30);
    if(c){ c.m.push({p,idx}); } else cl.push({x:xy[0],y:xy[1],m:[{p,idx}]}); });
  const boxes=[];
  const hit=(x0,y0,x1,y1)=>boxes.some(b=>x0<b[2]&&x1>b[0]&&y0<b[3]&&y1>b[1]);
  cl.forEach(c=>{
    const single=c.m.length===1, m0=c.m[0], hotel=single&&!!P[m0.p][4];
    const nums=c.m.flatMap(m=>m.idx).sort((a,b)=>a-b).map(i=>i+1);
    const txt = nums.join('·');
    const name = P[m0.p][2].split(/ [·(]/)[0] + (single?'':` 외 ${c.m.length-1}곳`);
    const isSel = sel && sel.type==='stop' && c.m.some(m=>m.idx.includes(sel.i));
    const g=el('g',{class:'pin',transform:`translate(${c.x},${c.y})`,tabindex:0,role:'button','aria-label':name},gOver);
    const w = Math.max(26, txt.length*7.2+12), h=26, grow=isSel?4:0;
    if(w<=26) el('circle',{r:13+grow/2,fill:hotel?'var(--hotel)':'var(--fg)'},g);
    else el('rect',{x:-w/2-grow/2,y:-h/2-grow/2,width:w+grow,height:h+grow,rx:13,fill:c.m.some(m=>P[m.p][4])&&single?'var(--hotel)':'var(--fg)',stroke:'var(--panel)','stroke-width':2.5},g);
    el('text',{},g).textContent=txt;
    boxes.push([c.x-w/2,c.y-h/2,c.x+w/2,c.y+h/2]);
    const label=el('text',{class:'lbl'},g);label.textContent=name;
    const lw=label.getComputedTextLength(), [sw,sh]=size();
    const offsets=[[w/2+5,0],[-w/2-5-lw,0],[-lw/2,-24],[-lw/2,24]];
    const pos=offsets.find(([dx,dy])=>{
      const x=c.x+dx,y=c.y+dy;
      return x>=2 && x+lw<sw-2 && y>10 && y<sh-10 && !hit(x,y-9,x+lw,y+9) &&
        !cl.some(pin=>pin!==c && pin.x+16>x && pin.x-16<x+lw && Math.abs(pin.y-y)<22);
    });
    if(pos){label.setAttribute('x',pos[0]);label.setAttribute('y',pos[1]);boxes.push([c.x+pos[0],c.y+pos[1]-9,c.x+pos[0]+lw,c.y+pos[1]+9]);}else label.remove();
    const act=()=>{ if(single) pickStop(m0.idx[0]); else { sel=null; markRail(); fit(c.m.map(m=>W(m.p)), 900); } };
    g.addEventListener('click',e=>{e.stopPropagation(); act();});
    g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); act();} });
  });
  // fill text color for pin numbers when fg is light (dark theme)
  const fg=getComputedStyle(document.documentElement).getPropertyValue('--bg');
  gOver.querySelectorAll('.pin text:not(.lbl)').forEach(t=>t.style.fill=fg.trim()||'#fff');
}

function ensureVisible(a,b){
  const [,lo,hi]=ranges()[scope]; if(a<lo || b>hi) selectScope(0);
}
function revealMap(){if(innerWidth<=860) document.querySelector('.mapcard').scrollIntoView({block:'start'});}
function pickStop(i){
  revealMap();
  ensureVisible(i,i); sel={type:'stop',i}; const p=day.stops[i].p;
  const [w,h]=size(), [x,y]=W(p), s=Math.max(view.s, 60);
  view={s, tx:w/2-x*s, ty:h/2-y*s}; render(); markRail();
}
function pickLeg(i){
  ensureVisible(i-1,i); revealMap(); sel={type:'leg',i}; fit([W(day.stops[i-1].p),W(day.stops[i].p)], 220); markRail();
}

function markRail(){
  document.querySelectorAll('.stop,.leg').forEach(e=>e.classList.remove('sel'));
  if(!sel) return;
  const n=document.querySelector(sel.type==='stop'?`.stop[data-i="${sel.i}"]`:`.leg[data-i="${sel.i}"]`);
  n&&n.classList.add('sel');
}

function buildRail(){
  const r=document.getElementById('rail'); r.textContent='';
  const h=document.createElement('div'); h.className='dayhead';
  h.innerHTML=`<h2></h2><p></p><a class="allroute" target="_blank" rel="noopener">구글맵에서 하루 경로 한 번에 열기 ↗</a>`; h.querySelector('h2').textContent=day.title; h.querySelector('p').textContent=day.note;
  h.querySelector('a').href='https://www.google.com/maps/dir/'+day.stops.map(s=>encodeURIComponent(P[s.p][3]).replace(/%20/g,'+')).join('/'); r.appendChild(h);
  const ol=document.createElement('ol'); ol.className='steps';
  day.stops.forEach((s,i)=>{
    if(i>0){
      const l=s.leg, li=document.createElement('li'); li.className='leg '+l.m; li.dataset.i=i;
      li.innerHTML=`<div class="bar"></div><div class="info"><span class="mode"></span><span class="min"></span><span class="cost"></span><a target="_blank" rel="noopener">구글맵 길찾기 ↗</a></div>`;
      li.querySelector('.mode').textContent=MODE[l.m]; li.querySelector('.min').textContent=l.min; li.querySelector('.cost').textContent=l.cost||'';
      li.querySelector('a').href=gDir(day.stops[i-1].p,s.p,l.m);
      li.querySelector('a').addEventListener('click',e=>e.stopPropagation());
      li.addEventListener('click',()=>pickLeg(i)); ol.appendChild(li);
    }
    const hotel=!!P[s.p][4], li=document.createElement('li'); li.className='stop'; li.dataset.i=i; li.tabIndex=0;
    li.innerHTML=`<div class="badge${hotel?' h':''}"></div><div><div class="t"></div><div class="n"></div><div class="d"></div><a target="_blank" rel="noopener">구글맵에서 보기 ↗</a></div>`;
    li.querySelector('.badge').textContent=i+1; li.querySelector('.t').textContent=s.t;
    li.querySelector('.n').textContent=P[s.p][2]; li.querySelector('.d').textContent=s.d;
    li.querySelector('a').href=gSearch(s.p); li.querySelector('a').addEventListener('click',e=>e.stopPropagation());
    li.addEventListener('click',()=>pickStop(i));
    li.addEventListener('keydown',e=>{ if(e.key==='Enter'){pickStop(i);} });
    ol.appendChild(li);
  });
  r.appendChild(ol);
  const n=document.createElement('div'); n.className='notes';
  n.innerHTML='<b>참고</b>'; day.tips.forEach(t=>{const d=document.createElement('div'); d.textContent='· '+t; n.appendChild(d);});
  r.appendChild(n);
}

function setDay(id){
  day=DAYS.find(d=>d.id===id)||DAYS[1]; sel=null;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.id===day.id));
  buildRail(); buildScopes(); selectScope(({d1:0,d2:2,d3:2,d4:1})[day.id]);
  try{ history.replaceState(null,'','#'+day.id); }catch(e){}
}

const tabs=document.getElementById('tabs');
DAYS.forEach(d=>{ const b=document.createElement('button'); b.className='tab'; b.role='tab'; b.dataset.id=d.id;
  b.innerHTML='<span></span><small></small>'; b.querySelector('span').textContent=d.tab; b.querySelector('small').textContent=({d1:'도착',d2:'마리나베이',d3:'센토사',d4:'시내·귀국'})[d.id];
  b.addEventListener('click',()=>setDay(d.id)); tabs.appendChild(b); });

// pan & zoom
function zoomAt(f,cx,cy){ const s=Math.min(Math.max(view.s*f,.4),900); f=s/view.s; view.tx=cx-(cx-view.tx)*f; view.ty=cy-(cy-view.ty)*f; view.s=s; render(); }
svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top); },{passive:false});
const ptrs=new Map(); let last=null, pinch=null;
svg.addEventListener('pointerdown',e=>{ ptrs.set(e.pointerId,[e.clientX,e.clientY]); if(e.target===svg) svg.setPointerCapture(e.pointerId); svg.classList.add('drag'); last=[e.clientX,e.clientY];
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch=Math.hypot(a[0]-b[0],a[1]-b[1]); } });
svg.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2 && pinch){ const [a,b]=[...ptrs.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]), r=svg.getBoundingClientRect();
    zoomAt(d/pinch,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top); pinch=d; return; }
  if(ptrs.size===1 && last){ view.tx+=e.clientX-last[0]; view.ty+=e.clientY-last[1]; last=[e.clientX,e.clientY]; render(); } });
const up=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; if(!ptrs.size){ svg.classList.remove('drag'); last=null; } else last=[...ptrs.values()][0]; };
svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
document.getElementById('zin').onclick=()=>{const [w,h]=size(); zoomAt(1.6,w/2,h/2);};
document.getElementById('zout').onclick=()=>{const [w,h]=size(); zoomAt(1/1.6,w/2,h/2);};
document.getElementById('zfit').onclick=()=>{ selectScope(0); };
let rt; window.addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(()=>{ selectScope(scope); },150);});
window.addEventListener('hashchange',()=>{ const id=location.hash.slice(1); if(id!==day.id && DAYS.some(d=>d.id===id)) setDay(id); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',render);

setDay(DAYS.some(d=>d.id===location.hash.slice(1)) ? location.hash.slice(1) : 'd2');
</script>
