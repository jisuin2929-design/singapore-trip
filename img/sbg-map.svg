  <!-- title -->
  <g transform="translate(280 836)">
    <text x="-276" y="0" font-size="14" font-weight="800" fill="#2f4a2b">싱가포르 보타닉 가든</text>
    <text x="-276" y="16" font-size="12" fill="#5f6b55">북 → 남 · 약 2.5km · 2시간</text>
