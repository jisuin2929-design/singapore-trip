  <ellipse cx="234" cy="410" rx="62" ry="46" fill="#e4f2d9" stroke="#a9cf98" stroke-dasharray="4 3"/>
  <rect x="242" y="86" width="72" height="44" rx="12" fill="#fde7b3" stroke="#e8b84d"/>
