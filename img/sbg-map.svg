    <circle cx="12" cy="16" r="6" fill="#e0503a"/><text x="22" y="20">걷는 길</text>
    <rect x="6" y="30" width="12" height="10" fill="#5f9e5a"/><text x="22" y="40">숲</text>
    <rect x="6" y="48" width="12" height="10" fill="#a9d6ef"/><text x="22" y="58">호수</text>
    <rect x="6" y="66" width="12" height="10" fill="#8a5a1e"/><text x="22" y="76">입구</text>
