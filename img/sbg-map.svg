<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <pattern id="tree" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#5f9e5a"/><circle cx="4" cy="4" r="3.2" fill="#4c8a48"/><circle cx="11" cy="10" r="3.2" fill="#4c8a48"/></pattern>
    <pattern id="orch" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#f6d3e4"/><circle cx="6" cy="6" r="2" fill="#e88bb6"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity=".35"/></filter>
  </defs>
  <rect width="400" height="860" fill="#f3efe4"/>
  <!-- roads -->
  <path d="M0 58 H400" stroke="#d9cfb8" stroke-width="20"/>
