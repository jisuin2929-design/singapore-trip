  <path d="M0 812 C120 800 260 806 400 790" stroke="#d9cfb8" stroke-width="20" fill="none"/>
  <text x="392" y="816" text-anchor="end" font-size="12" fill="#7a6d52">홀랜드 로드</text>
  <path d="M352 120 C362 300 370 520 356 790" stroke="#e6dcc6" stroke-width="12" fill="none"/>
  <text x="374" y="470" font-size="11" fill="#7a6d52" transform="rotate(90 374 470)">클루니 로드</text>
