    <rect x="22" y="352" width="22" height="34" rx="4" fill="#8a5a1e"/><text x="33" y="400" text-anchor="middle" font-size="11">타이어설</text><text x="33" y="414" text-anchor="middle" font-size="11">입구</text>
    <rect x="332" y="404" width="22" height="34" rx="4" fill="#8a5a1e"/><text x="340" y="398" text-anchor="middle" font-size="11">나심 입구</text>
