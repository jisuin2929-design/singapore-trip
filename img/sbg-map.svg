    <circle cx="178" cy="92" r="14" fill="#e0503a" stroke="#fff" stroke-width="3"/><text x="178" y="97" text-anchor="middle" fill="#fff">1</text>
    <circle cx="198" cy="212" r="14" fill="#e0503a" stroke="#fff" stroke-width="3"/><text x="198" y="217" text-anchor="middle" fill="#fff">2</text>
    <circle cx="184" cy="350" r="14" fill="#e0503a" stroke="#fff" stroke-width="3"/><text x="184" y="355" text-anchor="middle" fill="#fff">3</text>
    <circle cx="262" cy="454" r="14" fill="#e0503a" stroke="#fff" stroke-width="3"/><text x="262" y="459" text-anchor="middle" fill="#fff">4</text>
    <circle cx="172" cy="616" r="14" fill="#e0503a" stroke="#fff" stroke-width="3"/><text x="172" y="621" text-anchor="middle" fill="#fff">5</text>
    <circle cx="150" cy="684" r="14" fill="#e0503a" stroke="#fff" stroke-width="3"/><text x="150" y="689" text-anchor="middle" fill="#fff">6</text>
    <circle cx="192" cy="748" r="14" fill="#e0503a" stroke="#fff" stroke-width="3"/><text x="192" y="753" text-anchor="middle" fill="#fff">7</text>
