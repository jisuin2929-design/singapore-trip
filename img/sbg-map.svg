  <path d="M178 82 C186 120 200 160 198 212 C196 260 186 300 184 350 C182 400 196 430 230 446 C250 454 262 454 262 454 C250 500 232 530 214 560 C196 590 176 600 172 616 C166 640 150 660 150 684 C150 720 186 740 192 770" fill="none" stroke="#e0503a" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/>
